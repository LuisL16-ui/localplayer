# openspec/config.yaml
schema: spec-driven

context: |
  Tech stack: Kotlin 2.0.21 + Jetpack Compose BOM 2024.09.00 + Material3 + Navigation Compose 2.7.7
  Architecture: MVVM with ViewModels
  Build: AGP 9.0.0, Gradle 9.1.0, Kotlin DSL
  minSdk: 24, compileSdk: 36, targetSdk: 36
  Namespace: com.cvc953.localplayer
  Testing: JUnit 4 unit tests, AndroidJUnitRunner instrumented tests, Espresso 3.5.1
  Strict TDD: enabled
  Test command: ./gradlew test

strict_tdd: true

testing:
  unit_test_command: ./gradlew test
  instrumented_test_command: ./gradlew connectedAndroidTest
  framework: JUnit 4.13.2
  runner: androidx.test.runner.AndroidJUnitRunner
  layers:
    - unit
    - instrumentation
  coverage: not_configured
  quality_tools:
    formatter: kotlin.code.style=official
    linter: not_configured
    type_checker: not_configured

projects:
  - path: app/
    stack: Kotlin + Jetpack Compose + Material3 + Navigation Compose
    test_command: ./gradlew test
    framework: Android
    language: Kotlin 2.0.21

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected modules/packages
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
  apply:
    - Follow existing code patterns and conventions
    - Use Material3 components
    - RED-GREEN-REFACTOR enforced
  verify:
    - Run tests with ./gradlew test
    - Compare implementation against every spec scenario
    - Coverage threshold: 0 (not configured)
  archive:
    - Warn before merging destructive deltas (large removals)
